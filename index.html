<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Sidebar Navigation</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #e0e7ff);
        color: #1e293b;
      }

      /* Navbar */
      .nav {
        width: 100%;
        height: 75px;
        padding: 0 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(120deg, #312e81, #6366f1);
        color: white;
        box-shadow: 0 4px 20px rgba(49, 46, 129, 0.2);
      }

      .nav h2 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .nav h2 span {
        color: #a5f3fc;
      }

      #nav {
        width: 45px;
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 12px;
        font-size: 25px;
        cursor: pointer;
        transition: 0.3s;
      }

      #nav:hover {
        background: white;
        color: #4338ca;
        transform: scale(1.05);
      }

      /* Sidebar */
      #sidebar {
        width: 290px;
        height: 100vh;
        height: 100dvh;
        padding: 25px 18px;
        position: fixed;
        top: 0;
        right: -310px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        box-shadow: -10px 0 35px rgba(15, 23, 42, 0.12);
        transition: right 0.35s ease;
      }

      .show {
        right: 0 !important;
      }

      /* Sidebar Header */
      .side-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 8px 25px;
        border-bottom: 1px solid #e2e8f0;
        margin-bottom: 20px;
      }

      .side-head h2 {
        font-size: 23px;
        color: #312e81;
      }

      .side-head h2 span {
        color: #6366f1;
      }

      #close {
        width: 40px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: none;
        border-radius: 10px;
        background: #f1f5f9;
        color: #475569;
        font-size: 27px;
        cursor: pointer;
        transition: 0.3s;
      }

      #close:hover {
        background: #fee2e2;
        color: #dc2626;
        transform: rotate(90deg);
      }

      /* Navigation Links */
      ul {
        width: 100%;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      li {
        width: 100%;
        padding: 15px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        border-radius: 12px;
        color: #475569;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.25s ease;
      }

      li i {
        font-size: 21px;
        color: #6366f1;
      }

      li:hover {
        background: #eef2ff;
        color: #4338ca;
        padding-left: 24px;
      }

      /* Contact Button */
      .con {
        width: 100%;
        min-height: 50px;
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        background: linear-gradient(120deg, #4f46e5, #7c3aed);
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(99, 102, 241, 0.22);
        transition: 0.3s;
      }

      .con:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(99, 102, 241, 0.3);
      }

      /* Main Content */
      .content {
        min-height: calc(100vh - 75px);
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .content .badge {
        padding: 9px 16px;
        margin-bottom: 20px;
        border-radius: 30px;
        background: #e0e7ff;
        color: #4338ca;
        font-size: 13px;
        font-weight: 600;
      }

      .content h1 {
        font-size: clamp(30px, 5vw, 48px);
        margin-bottom: 15px;
        color: #1e1b4b;
      }

      .content h1 span {
        color: #6366f1;
      }

      .content p {
        max-width: 500px;
        color: #64748b;
        font-size: 16px;
        line-height: 1.8;
      }

      @media (max-width: 480px) {
        .nav {
          padding: 0 20px;
          height: 68px;
        }

        .nav h2 {
          font-size: 23px;
        }

        #sidebar {
          width: min(290px, 85vw);
          right: -100%;
        }

        .content {
          min-height: calc(100vh - 68px);
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <nav class="nav">
      <h2>Nova<span></span></h2>

      <button id="nav" onclick="opennav()" aria-label="Open navigation">
        <i class="ri-menu-line"></i>
      </button>
    </nav>

    <div id="sidebar">
      <div class="side-head">
        <h2>Nova<span></span></h2>

        <button id="close" onclick="closenav()" aria-label="Close navigation">
          <i class="ri-close-line"></i>
        </button>
      </div>

      <ul>
        <li><i class="ri-home-5-line"></i> Home</li>
        <li><i class="ri-user-line"></i> About</li>
        <li><i class="ri-settings-3-line"></i> Services</li>
        <li><i class="ri-code-s-slash-line"></i> Skills</li>
        <li><i class="ri-folder-line"></i> Projects</li>

        <button class="con">
          <i class="ri-mail-line"></i>
          Contact Us
        </button>
      </ul>
    </div>

    <main class="content">
      <div class="badge">
        <i class="ri-sparkling-line"></i> MODERN NAVIGATION
      </div>

      <h1>Explore Our <span>Website</span></h1>

      <p>
        Discover our services, explore our projects, and learn more about what
        we do. Click the menu icon to navigate through the website.
      </p>
    </main>

    <script>
      function opennav() {
        let navbtn = document.querySelector("#sidebar");
        navbtn.classList.toggle("show");
      }

      function closenav() {
        let closebtn = document.querySelector("#sidebar");
        closebtn.classList.toggle("show");
      }
    </script>
  </body>
</html>
